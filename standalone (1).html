<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoStream - Your Video Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #202117;
            color: #ffffff;
            overflow: hidden;
        }

        /* Glassmorphism Effects */
        .glass-effect {
            background: rgba(32, 33, 23, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(104, 108, 73, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(32, 33, 23, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(104, 108, 73, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .glass-input:focus {
            outline: none;
            border-color: #686c49;
            box-shadow: 0 0 0 2px rgba(104, 108, 73, 0.2);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .background-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(104, 108, 73, 0.05) 0%, transparent 50%, rgba(104, 108, 73, 0.05) 100%);
            pointer-events: none;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            transition: width 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-content {
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar.collapsed .sidebar-content {
            padding: 20px 10px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .sidebar.collapsed .logo {
            display: none;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: #686c49;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .collapse-btn:hover {
            background: rgba(104, 108, 73, 0.2);
        }

        .category-menu {
            margin-bottom: 30px;
        }

        .category-toggle {
            background: none;
            border: none;
            color: #686c49;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            transition: all 0.2s ease;
        }

        .category-toggle:hover {
            background: rgba(104, 108, 73, 0.2);
        }

        .sidebar.collapsed .category-toggle span {
            display: none;
        }

        .category-options {
            margin-top: 10px;
            padding-left: 20px;
        }

        .sidebar.collapsed .category-options {
            display: none;
        }

        .category-option {
            display: block;
            padding: 8px 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
        }

        .category-option:hover,
        .category-option.active {
            background: rgba(104, 108, 73, 0.2);
            color: #ffffff;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(104, 108, 73, 0.2);
            color: #ffffff;
        }

        .sidebar.collapsed .nav-item span {
            display: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Navigation */
        .top-nav {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(104, 108, 73, 0.3);
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 48px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #686c49;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(104, 108, 73, 0.2);
        }

        .upload-btn {
            background: #686c49;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background: rgba(104, 108, 73, 0.8);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            padding-bottom: 80px;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .video-card {
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: rgba(104, 108, 73, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .video-info {
            padding: 16px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .video-meta {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .video-action-btn {
            background: rgba(104, 108, 73, 0.2);
            border: none;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .video-action-btn:hover {
            background: rgba(104, 108, 73, 0.4);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 20;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .bottom-nav-item.active,
        .bottom-nav-item:hover {
            color: #686c49;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            padding: 24px;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-select {
            background: rgba(32, 33, 23, 0.4);
            border: 1px solid rgba(104, 108, 73, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            width: 100%;
        }

        .upload-area {
            border: 2px dashed rgba(104, 108, 73, 0.5);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #686c49;
            background: rgba(104, 108, 73, 0.1);
        }

        .btn-primary {
            background: #686c49;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: rgba(104, 108, 73, 0.8);
        }

        /* Page Content */
        .page-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            .sidebar .sidebar-content {
                padding: 20px 10px;
            }
            
            .sidebar .logo,
            .sidebar .category-toggle span,
            .sidebar .category-options,
            .sidebar .nav-item span {
                display: none;
            }
            
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px;
            }
            
            .content-area {
                padding: 16px;
            }
        }

        /* Hide scrollbar */
        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(104, 108, 73, 0.3);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb:hover {
            background: rgba(104, 108, 73, 0.5);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="background-gradient"></div>
        
        <!-- Sidebar -->
        <div class="sidebar glass-effect" id="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <div class="logo">VideoStream</div>
                    <button class="collapse-btn" onclick="toggleSidebar()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                </div>
                
                <div class="category-menu">
                    <button class="category-toggle" onclick="toggleCategories()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="1"/>
                            <circle cx="19" cy="12" r="1"/>
                            <circle cx="5" cy="12" r="1"/>
                        </svg>
                        <span>Categories</span>
                    </button>
                    <div class="category-options" id="categoryOptions">
                        <a href="#" class="category-option active" onclick="setCategory('videos')">Videos</a>
                        <a href="#" class="category-option" onclick="setCategory('music')">Music</a>
                        <a href="#" class="category-option" onclick="setCategory('guides')">Guides</a>
                    </div>
                </div>
                
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item" onclick="setPage('downloads')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>Downloads</span>
                    </a>
                    <a href="#" class="nav-item" onclick="setPage('history')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12,6 12,12 16,14"/>
                        </svg>
                        <span>History</span>
                    </a>
                </nav>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navigation -->
            <div class="top-nav glass-effect">
                <div class="search-container">
                    <input type="text" class="search-input glass-input" placeholder="Search videos, music, guides...">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </div>
                <div class="nav-actions">
                    <button class="action-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                        </svg>
                    </button>
                    <button class="upload-btn" onclick="openUploadModal()">Upload</button>
                    <button class="action-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <div class="page-content" id="pageContent">
                    <!-- Content will be dynamically loaded here -->
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-nav glass-effect">
            <a href="#" class="bottom-nav-item active" onclick="setSection('home')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="#" class="bottom-nav-item" onclick="setSection('shorts')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                <span>Shorts</span>
            </a>
            <a href="#" class="bottom-nav-item" onclick="setSection('subscriptions')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span>Subscriptions</span>
            </a>
            <a href="#" class="bottom-nav-item" onclick="setSection('playlists')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15V6"/>
                    <path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/>
                    <path d="M12 12H3"/>
                    <path d="M16 6H3"/>
                    <path d="M12 18H3"/>
                </svg>
                <span>Playlists</span>
            </a>
        </div>
    </div>
    
    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content glass-effect">
            <div class="modal-header">
                <h2 class="modal-title">Upload Video</h2>
                <button class="close-btn" onclick="closeUploadModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 16px; color: #686c49;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                </svg>
                <p>Click to select files or drag and drop</p>
                <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 8px;">Supports MP4, AVI, MOV files</p>
            </div>
            <input type="file" id="fileInput" style="display: none;" accept="video/*,audio/*" onchange="handleFileSelect(event)">
            
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="glass-input" placeholder="Enter video title" id="videoTitle">
            </div>
            
            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select glass-input" id="videoCategory">
                    <option value="videos">Videos</option>
                    <option value="music">Music</option>
                    <option value="guides">Guides</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Generated Link</label>
                <input type="text" class="glass-input" readonly id="generatedLink" placeholder="Link will appear here after upload">
            </div>
            
            <button class="btn-primary" onclick="uploadVideo()">Upload Video</button>
        </div>
    </div>

    <script>
        // Global state
        let currentSection = 'home';
        let currentCategory = 'videos';
        let currentPage = 'home';
        let sidebarCollapsed = false;
        let categoriesOpen = true;

        // Sample data
        const sampleVideos = {
            videos: [
                { id: 1, title: "Motivational Documentary", channel: "Motivation Channel", views: "1.2M", duration: "15:30", thumbnail: "😃" },
                { id: 2, title: "Coping Mechanism", channel: "Cope", views: "856K", duration: "8:45", thumbnail: "🧠" },
                { id: 3, title: "5 Habits that can bring Inner peace", channel: "Motivation Hub", views: "2.1M", duration: "12:20", thumbnail: "🙏" },
                { id: 4, title: "NEUROSCIENTIST: You Will NEVER Be Stressed Again", channel: "Dr Pal", views: "945K", duration: "18:15", thumbnail: "😝" }
            ],
            music: [
                { id: 5, title: "Chill Lo-Fi Beats", channel: "Lo-Fi Records", views: "3.5M", duration: "45:00", thumbnail: "🎵" },
                { id: 6, title: "Epic Orchestral Music", channel: "Epic Music", views: "1.8M", duration: "6:30", thumbnail: "🎼" },
                { id: 7, title: "Jazz Piano Collection", channel: "Jazz Corner", views: "892K", duration: "32:15", thumbnail: "🎹" }
            ],
            guides: [
                { id: 8, title: "How To Be Calm and Peaceful Within", channel: "Self Help", views: "1.5M", duration: "25:40", thumbnail: "❤️" },
                { id: 9, title: "How to Love Yourself", channel: "luvguru", views: "678K", duration: "14:20", thumbnail: "🤩" },
                { id: 10, title: "Eckhart Tolle Reveals the Secret to Accessing Deep Inner Peace", channel: "Eckhart Tolle", views: "1.1M", duration: "19:55", thumbnail: "😌" }
            ]
        };

        const downloadedVideos = [];
        const watchHistory = [];

        // Initialize app
        function init() {
            loadContent();
            updateActiveStates();
        }

        // Sidebar functions
        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed', sidebarCollapsed);
        }

        function toggleCategories() {
            categoriesOpen = !categoriesOpen;
            const options = document.getElementById('categoryOptions');
            options.style.display = categoriesOpen ? 'block' : 'none';
        }

        // Navigation functions
        function setSection(section) {
            currentSection = section;
            currentPage = 'home';
            loadContent();
            updateActiveStates();
        }

        function setCategory(category) {
            currentCategory = category;
            loadContent();
            updateActiveStates();
        }

        function setPage(page) {
            currentPage = page;
            loadContent();
            updateActiveStates();
        }

        // Content loading
        function loadContent() {
            const contentArea = document.getElementById('pageContent');
            
            if (currentPage === 'downloads') {
                contentArea.innerHTML = generateDownloadsPage();
            } else if (currentPage === 'history') {
                contentArea.innerHTML = generateHistoryPage();
            } else {
                contentArea.innerHTML = generateVideoGrid();
            }
        }

        function generateVideoGrid() {
            const videos = sampleVideos[currentCategory] || [];
            
            if (videos.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-icon">📹</div>
                        <h3>No ${currentCategory} available</h3>
                        <p>Check back later for new content!</p>
                    </div>
                `;
            }

            return `
                <h1 class="page-title">${currentSection.charAt(0).toUpperCase() + currentSection.slice(1)} - ${currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1)}</h1>
                <div class="video-grid">
                    ${videos.map(video => `
                        <div class="video-card glass-effect" onclick="playVideo(${video.id})">
                            <div class="video-thumbnail">
                                <span style="font-size: 48px;">${video.thumbnail}</span>
                            </div>
                            <div class="video-info">
                                <h3 class="video-title">${video.title}</h3>
                                <div class="video-meta">
                                    <span>${video.channel}</span>
                                    <span>•</span>
                                    <span>${video.views} views</span>
                                    <span>•</span>
                                    <span>${video.duration}</span>
                                </div>
                                <div class="video-actions">
                                    <button class="video-action-btn" onclick="event.stopPropagation(); downloadVideo(${video.id})">Download</button>
                                    <button class="video-action-btn" onclick="event.stopPropagation(); addToPlaylist(${video.id})">Save</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateDownloadsPage() {
            if (downloadedVideos.length === 0) {
                return `
                    <h1 class="page-title">Downloads</h1>
                    <div class="empty-state">
                        <div class="empty-icon">📥</div>
                        <h3>No downloads yet</h3>
                        <p>Downloaded videos will appear here for offline viewing</p>
                    </div>
                `;
            }

            return `
                <h1 class="page-title">Downloads</h1>
                <div class="video-grid">
                    ${downloadedVideos.map(video => `
                        <div class="video-card glass-effect">
                            <div class="video-thumbnail">
                                <span style="font-size: 48px;">${video.thumbnail}</span>
                            </div>
                            <div class="video-info">
                                <h3 class="video-title">${video.title}</h3>
                                <div class="video-meta">
                                    <span>${video.channel}</span>
                                    <span>•</span>
                                    <span>Downloaded</span>
                                </div>
                                <div class="video-actions">
                                    <button class="video-action-btn" onclick="playVideo(${video.id})">Play</button>
                                    <button class="video-action-btn" onclick="removeDownload(${video.id})">Remove</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateHistoryPage() {
            if (watchHistory.length === 0) {
                return `
                    <h1 class="page-title">Watch History</h1>
                    <div class="empty-state">
                        <div class="empty-icon">🕒</div>
                        <h3>No watch history</h3>
                        <p>Videos you watch will appear here</p>
                    </div>
                `;
            }

            return `
                <h1 class="page-title">Watch History</h1>
                <div class="video-grid">
                    ${watchHistory.map(video => `
                        <div class="video-card glass-effect">
                            <div class="video-thumbnail">
                                <span style="font-size: 48px;">${video.thumbnail}</span>
                            </div>
                            <div class="video-info">
                                <h3 class="video-title">${video.title}</h3>
                                <div class="video-meta">
                                    <span>${video.channel}</span>
                                    <span>•</span>
                                    <span>Watched</span>
                                </div>
                                <div class="video-actions">
                                    <button class="video-action-btn" onclick="playVideo(${video.id})">Watch Again</button>
                                    <button class="video-action-btn" onclick="removeFromHistory(${video.id})">Remove</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Video functions
        function playVideo(videoId) {
            const allVideos = [...sampleVideos.videos, ...sampleVideos.music, ...sampleVideos.guides];
            const video = allVideos.find(v => v.id === videoId);
            
            if (video && !watchHistory.find(v => v.id === videoId)) {
                watchHistory.unshift(video);
            }
            
            alert(`Playing: ${video.title}`);
        }

        function downloadVideo(videoId) {
            const allVideos = [...sampleVideos.videos, ...sampleVideos.music, ...sampleVideos.guides];
            const video = allVideos.find(v => v.id === videoId);
            
            if (video && !downloadedVideos.find(v => v.id === videoId)) {
                downloadedVideos.push(video);
                alert(`Downloaded: ${video.title}`);
            }
        }

        function addToPlaylist(videoId) {
            alert('Added to playlist!');
        }

        function removeDownload(videoId) {
            const index = downloadedVideos.findIndex(v => v.id === videoId);
            if (index > -1) {
                downloadedVideos.splice(index, 1);
                loadContent();
            }
        }

        function removeFromHistory(videoId) {
            const index = watchHistory.findIndex(v => v.id === videoId);
            if (index > -1) {
                watchHistory.splice(index, 1);
                loadContent();
            }
        }

        // Upload functions
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('videoTitle').value = file.name.replace(/\.[^/.]+$/, "");
                generateVideoLink();
            }
        }

        function generateVideoLink() {
            const title = document.getElementById('videoTitle').value;
            const category = document.getElementById('videoCategory').value;
            const link = `https://videostream.app/watch/${category}/${encodeURIComponent(title.toLowerCase().replace(/\s+/g, '-'))}`;
            document.getElementById('generatedLink').value = link;
        }

        function uploadVideo() {
            const title = document.getElementById('videoTitle').value;
            const category = document.getElementById('videoCategory').value;
            
            if (!title) {
                alert('Please enter a video title');
                return;
            }
            
            alert(`Video "${title}" uploaded successfully to ${category}!`);
            closeUploadModal();
            
            // Reset form
            document.getElementById('videoTitle').value = '';
            document.getElementById('generatedLink').value = '';
            document.getElementById('fileInput').value = '';
        }

        // Update active states
        function updateActiveStates() {
            // Update bottom navigation
            document.querySelectorAll('.bottom-nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[onclick="setSection('${currentSection}')"]`).classList.add('active');
            
            // Update category options
            document.querySelectorAll('.category-option').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[onclick="setCategory('${currentCategory}')"]`).classList.add('active');
            
            // Update sidebar navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            if (currentPage !== 'home') {
                const activeNavItem = document.querySelector(`[onclick="setPage('${currentPage}')"]`);
                if (activeNavItem) {
                    activeNavItem.classList.add('active');
                }
            }
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', init);

        // Add event listeners for title input to generate link
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('videoTitle');
            if (titleInput) {
                titleInput.addEventListener('input', generateVideoLink);
            }
        });
    </script>
</body>
</html>
