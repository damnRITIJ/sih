<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psycure - Your Wellness Companion</title>
    <link rel="stylesheet" href="style.css">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="logo">
                <img src="file.svg">
                <div class="logo-text">PSYCURE</div>
            </div>
            <div class="header-buttons">
               
                <a href="journal.html" class="journal-btn" id="journal-btn" style="display: none;">Journal</a>
                <button class="signin-btn" id="signin-btn">Sign In</button>
                <button id="signout-btn" class="signout-btn" display: none;>Sign Out</button> 
            </div>
        </header>

        <main class="chat-box" id="chat-box">
        </main>

        <footer>
            <div class="chat-input-wrapper">
                <div class="input-icon">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <input type="text" id="user-input" placeholder="Type your message...">
                <button id="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
            <div class="permission-toggle" id="permission-toggle" style="display: none;">
                <input type="checkbox" id="journal-permission">
                <label for="journal-permission" style="color: black;">Allow Psybot to see my journal entries for this session</label>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
